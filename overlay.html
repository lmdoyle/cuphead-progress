<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuphead Progress</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'Georgia', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .widget {
      position: relative;
      width: 320px;
    }

    .bar-track {
      width: 100%;
      height: 48px;
      background: #1a0a00;
      border: 3px solid #8b1a00;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 12px rgba(200, 40, 0, 0.5), inset 0 2px 6px rgba(0,0,0,0.6);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c82800 0%, #ff5a1f 60%, #ffd040 100%);
      transition: width 0.6s ease;
      position: relative;
    }

    .bar-fill::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 0;
      right: 0;
      height: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
    }

    .bar-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0 0 8px rgba(255, 90, 31, 0.8);
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 2;
    }

    .title {
      text-align: center;
      color: #ffd040;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 6px rgba(255, 208, 64, 0.7), 1px 1px 0 #000;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="title">Levels Complete</div>
    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
      <div class="bar-label" id="label">0 / 37</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const TOTAL = 37;
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'cuphead/total'), (snap) => {
      const beaten = snap.val() ?? 0;
      document.getElementById('bar').style.width = `${(beaten / TOTAL) * 100}%`;
      document.getElementById('label').textContent = `${beaten} / ${TOTAL}`;
    });
  </script>
</body>
</html>
